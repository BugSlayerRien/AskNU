name: mobileapp
description: "A new Flutter project."



version: 1.0.0+1

environment:
  sdk: ^3.10.0


dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.3.0

  firebase_auth: ^6.1.3      # Authentication
  cloud_firestore: ^6.1.1    # Firestore Database
  firebase_storage: ^13.0.5   # Cloud Storage
  firebase_messaging: ^16.1.0 # Push Notifications
  firebase_analytics: ^12.1.0 # Analytics
  firebase_crashlytics: ^5.0.6 # Crash Reporting
  google_sign_in: ^6.2.2
  http: ^1.6.0
  shared_preferences: ^2.0.15
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/faqs.json
    - assets/splash.svg
    - assets/logo.png

  fonts:
  - family: CenturyGothic
    fonts:
      - asset: assets/fonts/CenturyGothic.ttf
